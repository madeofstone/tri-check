<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri-Tracker — AAC Job Monitoring</title>
    <meta name="description" content="Monitor Alteryx Analytics Cloud job failures, trends and causes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="overview.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <svg class="topbar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <h1 class="topbar-title">Tri-Tracker</h1>
            <nav class="topbar-tabs">
                <button class="topbar-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
                    Dashboard
                </button>
                <button class="topbar-tab" data-tab="allJobs" onclick="switchTab('allJobs')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                    All Jobs
                </button>
            </nav>
        </div>
        <div class="topbar-right">
            <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-1.42 3.42 2 2 0 0 1-1.42-.59l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-3.42-1.42 2 2 0 0 1 .59-1.42l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 1.42-3.42 2 2 0 0 1 1.42.59l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.08 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 3.42 1.42 2 2 0 0 1-.59 1.42l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1.08z"/></svg>
            </button>
        </div>
    </header>

    <div class="app-layout">
        <!-- ====== DASHBOARD TAB ====== -->
        <div class="tab-panel active" id="tabDashboard">
            <div class="ov-wrap">
                <div class="ov-toolbar">
                    <div class="ov-windows">
                        <button class="ov-window-btn" data-window="1h" onclick="ovLoad('1h')">1h</button>
                        <button class="ov-window-btn" data-window="6h" onclick="ovLoad('6h')">6h</button>
                        <button class="ov-window-btn active" data-window="24h" onclick="ovLoad('24h')">24h</button>
                        <button class="ov-window-btn" data-window="7d" onclick="ovLoad('7d')">7d</button>
                        <button class="ov-window-btn" data-window="14d" onclick="ovLoad('14d')">14d</button>
                    </div>
                    <div class="ov-sync-row">
                        <span class="ov-sync-status" id="ovSyncStatus"></span>
                        <button class="btn-secondary" id="ovSyncBtn" onclick="ovStartSync(false)">Sync now</button>
                    </div>
                </div>
                <div id="ovContent"></div>
            </div>
        </div>

        <!-- ====== ALL JOBS TAB ====== -->
        <div class="tab-panel" id="tabAllJobs">
            <!-- Left Sidebar — Filters -->
            <aside class="sidebar" id="ajSidebar">
                <div class="sidebar-header">
                    <span class="sidebar-label">Filters</span>
                </div>
                <div class="aj-sidebar-body">
                    <!-- Group by Flow toggle -->
                    <div class="aj-filter-group-toggle">
                        <label class="aj-toggle-row" for="ajGroupToggle">
                            <div class="aj-toggle-info">
                                <span class="aj-toggle-title">Group by Flow</span>
                                <span class="aj-toggle-desc">Collapse jobs into flow groups</span>
                            </div>
                            <div class="aj-toggle-switch">
                                <input type="checkbox" id="ajGroupToggle" onchange="ajToggleGroup()">
                                <span class="aj-toggle-slider"></span>
                            </div>
                        </label>
                    </div>

                    <!-- Status Filter -->
                    <div class="aj-filter-section">
                        <label class="aj-filter-label" for="ajStatusFilter">Status</label>
                        <select class="aj-filter-select" id="ajStatusFilter" onchange="ajApplyFilters()">
                            <option value="">All</option>
                            <option value="Complete">Complete</option>
                            <option value="Failed">Failed</option>
                            <option value="Running">Running</option>
                        </select>
                    </div>

                    <!-- Date Range Filter -->
                    <div class="aj-filter-section">
                        <label class="aj-filter-label" for="ajDaysFilter">Time Range</label>
                        <select class="aj-filter-select" id="ajDaysFilter" onchange="ajApplyFilters()">
                            <option value="7">Last 7 Days</option>
                            <option value="14">Last 14 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                        </select>
                    </div>
                </div>
            </aside>

            <main class="main-content" id="allJobsContent">
              <div class="view-slider" id="ajViewSlider">
                <div class="view-panel view-panel-main">
                <div class="aj-sticky-header">
                <!-- KPI Strip + Daily Chart -->
                <div class="aj-kpi-row" id="ajKpiRow">
                    <div class="aj-kpi-cards">
                        <div class="aj-kpi"><span class="aj-kpi-value" id="ajKpiTotal">—</span><span class="aj-kpi-label">Total Jobs</span></div>
                        <div class="aj-kpi"><span class="aj-kpi-value" id="ajKpiRate">—</span><span class="aj-kpi-label">Success Rate</span></div>
                        <div class="aj-kpi"><span class="aj-kpi-value" id="ajKpiDaily">—</span><span class="aj-kpi-label">Jobs / Day (7d)</span></div>
                    </div>
                    <div class="aj-daily-chart-wrap">
                        <div class="aj-chart-body">
                            <canvas id="ajDailyChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Toolbar: Update + Search -->
                <div class="aj-toolbar">
                    <div class="aj-toolbar-left">
                        <button class="btn-primary" id="ajCompareBtn" onclick="openCompareModal()" style="display:none; padding-right: 8px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                            Compare (<span id="ajCompareCount">0</span>/4)
                            <span class="compare-clear-btn" onclick="clearCompareSelection(event)" title="Clear selection">✕</span>
                        </button>
                        <button class="btn-primary" id="ajFetchBtn" onclick="ajFetchJobs()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                            Update
                        </button>
                        <button class="btn-secondary" id="ajRefreshBtn" onclick="ajRefreshJobs()" title="Re-fetch all existing jobs to update statuses">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                            Refresh
                        </button>
                        <div class="aj-search-wrap">
                            <input type="text" class="aj-search" id="ajSearch" placeholder="Search jobs…" oninput="ajApplyFilters()">
                        </div>
                    </div>
                </div>
                </div> <!-- /aj-sticky-header -->

                <!-- Loading -->
                <div class="loading" id="ajLoading" style="display:none">
                    <div class="spinner"></div>
                    <span>Fetching jobs…</span>
                </div>

                <!-- Error -->
                <div class="error-banner" id="ajError" style="display:none"></div>

                <!-- Results Table -->
                <div class="ov-chip-bar" id="ajHandoffBar" style="display:none"></div>
                <div class="aj-table-wrap" id="ajTableWrap" style="display:none">
                    <div class="table-scroll">
                        <table class="results-table aj-table" id="ajTable">
                            <thead id="ajTableHead"></thead>
                            <tbody id="ajTableBody"></tbody>
                        </table>
                    </div>
                    <div class="aj-load-more" id="ajLoadMore" style="display:none">
                        <button class="btn-secondary" id="ajLoadMoreBtn" onclick="ajLoadMore()">Load More</button>
                        <span class="aj-load-more-count" id="ajLoadMoreCount"></span>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="ajEmpty">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                    <h2>No jobs loaded yet</h2>
                    <p>Click <strong>Update</strong> to fetch the latest jobs from your AACP workspace.</p>
                </div>
                </div><!-- .view-panel-main -->

                <div class="view-panel view-panel-dashboard" id="ajDashboardPanel">
                    <!-- Dashboard content injected by dashboard.js -->
                </div>
              </div><!-- .view-slider -->
            </main>
        </div>

        <!-- ====== FLOW ANALYSIS TAB ====== -->


    <!-- Add Flow Dialog (overlay) -->
    <div class="modal-backdrop" id="addFlowModal" style="display:none">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Add Flow</h3>
                <button class="icon-btn icon-btn-sm modal-close" id="addFlowCancel" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <label for="newFlowName">Flow Name</label>
                <input type="text" id="newFlowName" placeholder="e.g. flow_20260123_145635" autofocus>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="addFlowCancelBtn">Cancel</button>
                <button class="btn-primary" id="addFlowConfirm">Add Flow</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="settingsModal" style="display:none">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="icon-btn icon-btn-sm modal-close" id="settingsClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="settingsBody">
                <!-- Populated dynamically -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="settingsCancelBtn">Cancel</button>
                <button class="btn-primary" id="settingsSaveBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Comparison Modal -->
    <div class="modal-backdrop" id="compareModal" style="display:none">
        <div class="modal modal-xl">
            <div class="modal-header">
                <h3>Compare Job Runs</h3>
                <button class="icon-btn icon-btn-sm modal-close" id="compareClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="compareBody" style="padding:0">
                <!-- Injected via app.js -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="dashboard.js"></script>
    <script src="all_jobs.js"></script>
    <script src="app.js"></script>
    <script src="overview.js"></script>
</body>
</html>
